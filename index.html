<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discord Clone Pro</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: sans-serif; 
      /* Make entire UI unhighlightable by default */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    html, body { height: 100dvh; width: 100vw; overflow: hidden; background-color: #313338; color: #dbdee1; }
    #app { display: flex; height: 100dvh; width: 100vw; overflow: hidden; }
    
    #auth-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999;
    }
    .modal-box { background: #313338; padding: 32px; border-radius: 8px; width: 360px; text-align: center; border: 1px solid #1e1f22; }
    .modal-box h2 { color: #f2f3f5; margin-bottom: 8px; }
    .modal-box p { color: #949ba4; font-size: 13px; margin-bottom: 16px; }
    .modal-box input {
      width: 100%; padding: 12px; border-radius: 4px; border: 1px solid #1e1f22;
      background: #1e1f22; color: #f2f3f5; font-size: 15px; margin-bottom: 12px; outline: none;
      /* Allow text selection in input boxes so users can type and edit */
      -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text;
    }
    .pfp-upload-label { display: block; color: #b5bac1; font-size: 13px; margin-bottom: 6px; text-align: left; }
    .modal-box button {
      width: 100%; padding: 12px; background: #5865f2; border: none; border-radius: 4px;
      color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 12px;
    }
    .modal-box button:hover { background: #4752c4; }
    .switch-auth { color: #00a8fc; font-size: 13px; cursor: pointer; text-decoration: underline; }
    .error-msg { color: #fa777c; font-size: 13px; margin-bottom: 12px; }

    .servers-bar { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; flex-shrink: 0; }
    .server-icon { width: 48px; height: 48px; background: #5865f2; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

    .channels-sidebar { width: 220px; background: #2b2d31; display: flex; flex-direction: column; flex-shrink: 0; }
    .server-header { height: 48px; padding: 0 16px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; justify-content: space-between; font-weight: bold; color: #f2f3f5; flex-shrink: 0; }
    .channel-list { padding: 12px 8px; flex: 1; overflow-y: auto; min-height: 0; }
    .category { font-size: 11px; font-weight: bold; color: #949ba4; text-transform: uppercase; margin: 12px 0 6px 8px; }
    .channel-item { padding: 8px; border-radius: 4px; cursor: pointer; color: #949ba4; font-size: 14px; margin-bottom: 2px; }
    .channel-item:hover, .channel-item.active { background: #35373c; color: #f2f3f5; }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: #313338; min-width: 0; height: 100%; }
    .chat-header { height: 48px; border-bottom: 1px solid #202225; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: bold; color: #f2f3f5; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #fa777c; flex-shrink: 0; }
    .status-dot.online { background: #23a55a; }
    .call-btn-group { display: flex; gap: 8px; display: none; }
    .call-btn { background: #23a55a; border: none; color: white; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .call-btn:hover { background: #1f8a4c; }

    .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .message { display: flex; gap: 12px; position: relative; padding: 4px 8px; border-radius: 4px; }
    .message:hover { background-color: #2e3035; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .msg-body { display: flex; flex-direction: column; max-width: 85%; flex: 1; }
    .msg-header { display: flex; align-items: baseline; gap: 8px; }
    .username { font-weight: bold; color: #f2f3f5; font-size: 14px; }
    .time { font-size: 11px; color: #949ba4; }
    
    /* ALLOW text highlighting ONLY inside sent message text */
    .text { 
      color: #dbdee1; 
      font-size: 14px; 
      margin-top: 4px; 
      word-wrap: break-word; 
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    /* Copy Button on Message Hover */
    .copy-btn {
      display: none;
      position: absolute;
      right: 12px;
      top: 6px;
      background: #2b2d31;
      border: 1px solid #1e1f22;
      color: #b5bac1;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .copy-btn:hover { background: #35373c; color: #f2f3f5; }
    .message:hover .copy-btn { display: block; }
    
    .media-preview { max-width: 300px; max-height: 200px; border-radius: 6px; margin-top: 6px; display: block; }
    .video-preview { max-width: 320px; max-height: 220px; border-radius: 6px; margin-top: 6px; outline: none; }
    .file-attachment { background: #2b2d31; padding: 8px 12px; border-radius: 4px; display: inline-block; margin-top: 6px; color: #00a8fc; text-decoration: none; font-size: 13px; }

    .input-area { padding: 12px 16px; flex-shrink: 0; background: #313338; }
    .input-box-wrapper { background: #383a40; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; }
    .file-btn { color: #b5bac1; cursor: pointer; font-size: 18px; font-weight: bold; }
    .input-box-wrapper input[type="text"] { 
      flex: 1; background: transparent; border: none; color: #f2f3f5; font-size: 14px; outline: none; 
      -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text;
    }

    .users-sidebar { width: 180px; background: #2b2d31; padding: 16px; flex-shrink: 0; overflow-y: auto; display: none; }
    @media(min-width: 768px) { .users-sidebar { display: block; } }
    .user-item { display: flex; align-items: center; gap: 8px; padding: 6px; color: #949ba4; font-size: 13px; cursor: pointer; border-radius: 4px; }
    .user-item:hover { background: #35373c; color: #f2f3f5; }

    #call-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10000;
    }
    .video-grid { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .call-box-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    video { width: 320px; height: 240px; background: #1e1f22; border-radius: 12px; object-fit: cover; border: 3px solid #35373c; }
    .call-controls { display: flex; gap: 16px; }
    .hangup-btn { background: #fa777c; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
    .hangup-btn:hover { background: #d9534f; }
  </style>
</head>
<body>

  <div id="auth-modal">
    <div class="modal-box">
      <h2 id="modal-title">Welcome Back</h2>
      <p id="modal-desc">Log in or create your profile.</p>
      <div id="auth-error" class="error-msg"></div>
      
      <input type="text" id="auth-user" placeholder="Username" autocomplete="off" />
      <input type="password" id="auth-pass" placeholder="Password" />
      
      <div id="pfp-container" style="display:none;">
        <label class="pfp-upload-label">Profile Picture (Optional):</label>
        <input type="file" id="pfp-input" accept="image/*" style="color:#949ba4; font-size:13px; margin-bottom:12px;" />
      </div>

      <button type="button" id="auth-btn" onclick="submitAuth()">Log In</button>
      <div class="switch-auth" onclick="toggleAuth()" id="switch-btn">Need an account? Register</div>
    </div>
  </div>

  <div id="call-modal">
    <h3 id="call-status" style="color: white; margin-bottom: 20px;">Connecting Call...</h3>
    <div class="video-grid">
      <div class="call-box-wrapper">
        <p style="color:#949ba4; font-size:13px;">You</p>
        <video id="local-video" autoplay muted playsinline></video>
      </div>
      <div class="call-box-wrapper">
        <p style="color:#949ba4; font-size:13px;">Friend</p>
        <video id="remote-video" autoplay playsinline></video>
        <audio id="remote-audio" autoplay></audio>
      </div>
    </div>
    <div class="call-controls">
      <button class="hangup-btn" onclick="endCall()">End Call</button>
    </div>
  </div>

  <div id="app">
    <div class="servers-bar"><div class="server-icon">D</div></div>
    <div class="channels-sidebar">
      <div class="server-header" id="current-user-display">My Server</div>
      <div class="channel-list">
        <div class="category">Text Channels</div>
        <div class="channel-item active" onclick="switchChannel('general', this)"># general</div>
        <div class="channel-item" onclick="switchChannel('random', this)"># random</div>
        <div class="channel-item" onclick="switchChannel('gaming', this)"># gaming</div>
        <div class="category">Direct Messages</div>
        <div id="dm-list"></div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <div class="header-left">
          <div class="status-dot" id="net-status"></div>
          <span id="room-title"># general</span>
        </div>
        <div id="call-btn-group" class="call-btn-group">
          <button class="call-btn" onclick="startCall(true)">📹 Video Call</button>
          <button class="call-btn" style="background:#5865f2;" onclick="startCall(false)">📞 Voice Call</button>
        </div>
      </div>
      <div class="messages-container" id="messages-list"></div>
      <div class="input-area">
        <div class="input-box-wrapper">
          <label class="file-btn" title="Upload Image, Video or File">+<input type="file" id="file-input" style="display:none" onchange="attachFile(event)"></label>
          <input type="text" id="msg-input" placeholder="Message #general" autocomplete="off" onkeydown="handleEnter(event)" />
        </div>
      </div>
    </div>

    <div class="users-sidebar">
      <div class="category" id="online-count">ONLINE — 0</div>
      <div id="online-users"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let me = '';
    let myPfp = null;
    let currentRoom = 'general';
    let isRegister = false;
    let fileObj = null;

    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let iceCandidateQueue = [];

    const rtcConfig = { 
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.ekiga.net' }
      ] 
    };

    socket.on('connect', () => document.getElementById('net-status').classList.add('online'));
    socket.on('disconnect', () => document.getElementById('net-status').classList.remove('online'));

    function toggleAuth() {
      isRegister = !isRegister;
      document.getElementById('modal-title').innerText = isRegister ? 'Create Account' : 'Welcome Back';
      document.getElementById('auth-btn').innerText = isRegister ? 'Register' : 'Log In';
      document.getElementById('switch-btn').innerText = isRegister ? 'Already have an account? Log In' : 'Need an account? Register';
      document.getElementById('pfp-container').style.display = isRegister ? 'block' : 'none';
      document.getElementById('auth-error').innerText = '';
    }

    function submitAuth() {
      const username = document.getElementById('auth-user').value.trim();
      const password = document.getElementById('auth-pass').value.trim();

      if (!username || !password) {
        document.getElementById('auth-error').innerText = 'Please fill out username and password.';
        return;
      }

      if (isRegister) {
        const pfpFile = document.getElementById('pfp-input').files[0];
        if (pfpFile) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            myPfp = evt.target.result;
            socket.emit('register', { username, password, pfp: myPfp });
          };
          reader.readAsDataURL(pfpFile);
        } else {
          socket.emit('register', { username, password, pfp: null });
        }
      } else {
        socket.emit('login', { username, password });
      }
    }

    socket.on('auth_error', (msg) => document.getElementById('auth-error').innerText = msg);
    socket.on('auth_success', (data) => {
      me = data.username;
      myPfp = data.pfp;
      document.getElementById('auth-modal').style.display = 'none';
      
      const headerDisplay = document.getElementById('current-user-display');
      if (myPfp) {
        headerDisplay.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><div class="avatar" style="width:28px;height:28px;"><img src="${myPfp}"></div><span>${me}</span></div>`;
      } else {
        headerDisplay.innerText = `👤 ${me}`;
      }
      socket.emit('join_room', { room: currentRoom });
    });

    function switchChannel(roomName, el) {
      if (!me) return;
      currentRoom = roomName;
      const isDM = roomName.startsWith('dm_');
      const label = isDM ? `DM: ${roomName.replace('dm_', '').replace(me, '').replace(/_/g, '')}` : `# ${roomName}`;
      
      document.getElementById('room-title').innerText = label;
      document.getElementById('msg-input').placeholder = `Message ${label}`;
      document.getElementById('call-btn-group').style.display = isDM ? 'flex' : 'none';

      document.getElementById('messages-list').innerHTML = '';
      document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');
      socket.emit('join_room', { room: currentRoom });
    }

    function startDM(targetUser) {
      if (targetUser === me) return;
      const pair = [me, targetUser].sort();
      switchChannel(`dm_${pair[0]}_${pair[1]}`, null);
    }

    async function startCall(isVideo) {
      document.getElementById('call-modal').style.display = 'flex';
      document.getElementById('call-status').innerText = isVideo ? 'Starting Video Call...' : 'Starting Voice Call...';
      
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
        const localVideo = document.getElementById('local-video');
        localVideo.srcObject = localStream;
        localVideo.style.display = isVideo ? 'block' : 'none';
        
        createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        
        document.getElementById('call-status').innerText = 'Calling friend...';
        socket.emit('call_offer', { room: currentRoom, offer, sender: me, isVideo });
      } catch (err) {
        alert('Camera/Microphone access denied or unavailable.');
        endCall();
      }
    }

    function createPeerConnection() {
      if (peerConnection) peerConnection.close();
      peerConnection = new RTCPeerConnection(rtcConfig);
      iceCandidateQueue = [];

      remoteStream = new MediaStream();
      const remoteVideo = document.getElementById('remote-video');
      const remoteAudio = document.getElementById('remote-audio');
      remoteVideo.srcObject = remoteStream;
      remoteAudio.srcObject = remoteStream;

      peerConnection.ontrack = (event) => {
        event.streams[0].getTracks().forEach(track => {
          remoteStream.addTrack(track);
        });
        remoteVideo.play().catch(e => console.log(e));
        document.getElementById('call-status').innerText = 'Connected!';
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice_candidate', { room: currentRoom, candidate: event.candidate });
        }
      };
    }

    socket.on('incoming_call', async ({ offer, sender, isVideo }) => {
      const callType = isVideo ? 'video call' : 'voice call';
      if (!confirm(`Incoming ${callType} from ${sender}. Accept?`)) return;
      
      document.getElementById('call-modal').style.display = 'flex';
      document.getElementById('call-status').innerText = 'Connecting...';
      
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
        const localVideo = document.getElementById('local-video');
        localVideo.srcObject = localStream;
        localVideo.style.display = isVideo ? 'block' : 'none';

        createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        
        while (iceCandidateQueue.length > 0) {
          const candidate = iceCandidateQueue.shift();
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        }

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        
        socket.emit('call_answer', { room: currentRoom, answer });
      } catch (err) {
        alert('Could not start call media.');
        endCall();
      }
    });

    socket.on('call_answered', async ({ answer }) => {
      try {
        if (peerConnection) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
          
          while (iceCandidateQueue.length > 0) {
            const candidate = iceCandidateQueue.shift();
            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
          }

          document.getElementById('call-status').innerText = 'Connected!';
        }
      } catch (e) {
        console.error(e);
      }
    });

    socket.on('ice_candidate', async ({ candidate }) => {
      try {
        if (peerConnection) {
          if (peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
          } else {
            iceCandidateQueue.push(candidate);
          }
        }
      } catch (e) {
        console.error(e);
      }
    });

    function endCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      iceCandidateQueue = [];
      document.getElementById('call-modal').style.display = 'none';
      document.getElementById('local-video').srcObject = null;
      document.getElementById('remote-video').srcObject = null;
      document.getElementById('remote-audio').srcObject = null;
      socket.emit('hangup', { room: currentRoom });
    }

    socket.on('hangup', () => { endCall(); });

    function attachFile(e) {
      const file = e.target.files[0];
      if (!file) re
